name: Collect & Save Proxies

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Открываем права на запись для github-actions[bot] внутри этого воркфлоу
    permissions:
      contents: write

    steps:
    - name: Checkout GitHub repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install aiohttp

    - name: Run collector script
      run: python "parser[#LSO-#LinSpisokObhod].py"

    # ========== Сохраняем только чистые текстовые файлы на GitHub ==========
    - name: Commit and push plain text files to GitHub
      run: |
        # Удаляем base64 файлы из рабочей директории перед добавлением в Git
        rm -f sub/*.64.txt
        
        # Настраиваем локального Git-бота
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Добавляем текстовые результаты работы парсера и README
        git add sub/ README.md
        
        # Проверяем, изменились ли файлы, чтобы не создавать пустые коммиты
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update proxy configs [skip ci]"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No changes detected. Skipping push."
        fi
